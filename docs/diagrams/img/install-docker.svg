<svg xmlns="http://www.w3.org/2000/svg" width="1514" height="194" viewBox="0 0 1514 194" font-size="12"><title>2.2.1 Install Docker Desktop</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5A7D86"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0.0" y="18.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F1B1E" text-anchor="start">2.2.1 Install Docker Desktop</text><text x="0.0" y="36.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5C63" text-anchor="start">Windows requires WSL 2 first</text><rect x="0.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="14.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-anchor="start">Step 1 — Enable WSL 2</text><text x="14.0" y="92.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">PowerShell as Administrator</text><text x="14.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Windows only</text><text x="14.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Restart if prompted</text><path d="M250.0,98.0 L304.0,98.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="304.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#12211F" stroke="#12211F" stroke-width="1.2"/><text x="318.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">wsl --install</text><text x="318.0" y="92.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#9FD8C8" text-anchor="start">Installs the WSL 2 kernel</text><text x="318.0" y="107.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#9FD8C8" text-anchor="start">and a default distribution</text><path d="M554.0,98.0 L608.0,98.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="608.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="622.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-anchor="start">Step 2 — Install</text><text x="622.0" y="92.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Download from docker.com</text><text x="622.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Keep 'Use WSL 2' ticked</text><text x="622.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Launch Docker Desktop</text><path d="M858.0,98.0 L912.0,98.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="912.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="926.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-anchor="start">Step 3 — Configure</text><text x="926.0" y="92.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Settings &gt; Resources</text><text x="926.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">At least 4 CPUs and 8 GB</text><text x="926.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">— six services run at once</text><path d="M1162.0,98.0 L1216.0,98.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="1216.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#12211F" stroke="#12211F" stroke-width="1.2"/><text x="1230.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">Verify</text><text x="1230.0" y="92.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#9FD8C8" text-anchor="start">docker --version</text><text x="1230.0" y="107.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#9FD8C8" text-anchor="start">docker compose version</text><text x="1230.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#9FD8C8" text-anchor="start">docker run hello-world</text></g></svg>