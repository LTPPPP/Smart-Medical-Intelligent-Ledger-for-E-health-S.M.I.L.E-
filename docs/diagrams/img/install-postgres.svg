<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="222" viewBox="0 0 1210 222" font-size="12"><title>2.2.4 Install PostgreSQL 16</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5A7D86"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0.0" y="18.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F1B1E" text-anchor="start">2.2.4 Install PostgreSQL 16</text><text x="0.0" y="36.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5C63" text-anchor="start">One server, six logical databases</text><rect x="0.0" y="50.0" width="250.0" height="124.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="14.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-anchor="start">Step 1 — Download</text><text x="14.0" y="92.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">postgresql.org/download</text><text x="14.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">EnterpriseDB installer</text><text x="14.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">for Windows (64-bit)</text><path d="M250.0,112.0 L304.0,112.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="304.0" y="50.0" width="250.0" height="124.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="318.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-an