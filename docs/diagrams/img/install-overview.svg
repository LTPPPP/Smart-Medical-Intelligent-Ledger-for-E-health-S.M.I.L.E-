<svg xmlns="http://www.w3.org/2000/svg" width="1514" height="194" viewBox="0 0 1514 194" font-size="12"><title>Installation overview</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5A7D86"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0.0" y="18.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F1B1E" text-anchor="start">Installation overview</text><text x="0.0" y="36.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5C63" text-anchor="start">Four prerequisites, then the stack itself</text><rect x="0.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="14.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-anchor="start">1. Docker Desktop</text><text x="14.0" y="92.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Container runtime for the</text><text x="14.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">six application services</text><text x="14.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">and the databases</text><path d="M250.0,98.0 L304.0,98.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="304.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="318.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-anchor="start">2. Node.js 20 LTS</text><text x="318.0" y="92.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Runs the NestJS services</text><text x="318.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">and the Next.js web</text><text x="318.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">application</text><path d="M554.0,98.0 L608.0,98.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="608.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="622.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-anchor="start">3. Python 3.11 / 3.13</text><text x="622.0" y="92.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Runs kyc_ocr_service and</text><text x="622.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">booking_langgraph_service</text><text x="622.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">in separate venvs</text><path d="M858.0,98.0 L912.0,98.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="912.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#DCEBFA" stroke="#4A7EBB" stroke-width="1.2"/><text x="926.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1B1E" text-anchor="start">4. PostgreSQL 16</text><text x="926.0" y="92.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">Six logical databases,</text><text x="926.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4A5C63" text-anchor="start">one per service boundary</text><path d="M1162.0,98.0 L1216.0,98.0" fill="none" stroke="#5A7D86" stroke-width="1.2" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="1216.0" y="50.0" width="250.0" height="96.0" rx="6" fill="#12211F" stroke="#12211F" stroke-width="1.2"/><text x="1230.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">5. Start the stack</text><text x="1230.0" y="92.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#9FD8C8" text-anchor="start">make up</text><text x="1230.0" y="107.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#9FD8C8" text-anchor="start">docker compose ps</text></g></svg>