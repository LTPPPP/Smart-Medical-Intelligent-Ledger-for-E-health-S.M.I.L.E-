name: CD

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ltpppp/smile

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      any_changed: ${{ steps.build-matrix.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            iam-service:
              - 'backend/service/iam-service/**'
            payment-service:
              - 'backend/service/payment-service/**'
            gateway-service:
              - 'backend/service/gateway-service/**'
            clinical-emr-service:
              - 'backend/service/clinical-emr-service/**'
            smile-client:
              - 'frontend/web/**'
            shared:
              - 'compose.prod.yaml'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - 'infra/**'
              - '.github/workflows/**'
              - 'backend/libs/**'
              - 'backend/package.json'
              - 'backend/package-lock.json'
              - 'backend/tsconfig*.json'

      - name: Build dynamic matrix
        id: build-matrix
        run: bash infra/ci/scripts/build-matrix.sh '${{ steps.filter.outputs.changes }}'

  build-image:
    name: Build (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-stag:
    name: Deploy / Stag
    needs: [detect-changes, build-image]
    if: always() && !failure() && !cancelled() && contains(fromJSON('["refs/heads/dev"]'), github.ref)
    runs-on: stag
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.ref_name }}
      VNPAY_MOCK: ${{ vars.VNPAY_MOCK }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Infisical Login
        run: |
          INFISICAL_TOKEN="$(
            infisical login \
              --domain="${{ secrets.INFISICAL_URL }}" \
              --method=universal-auth \
              --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" \
              --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" \
              --silent \
              --plain
          )"

          echo "::add-mask::$INFISICAL_TOKEN"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"

      - name: Clean Container, Image And Prepare For Deploy
        run: |
          infisical run \
            --env=stag \
            --token="$INFISICAL_TOKEN" \
            --domain="${{ secrets.INFISICAL_URL }}" \
            --projectId="${{ secrets.INFISICAL_PROJECT_ID }}" \
            --path=/ \
            -- \
            docker compose \
              -f infra/stag/compose.yaml \
              -p smile \
              up -d \
              --remove-orphans

      - name: Cleanup Image
        run: docker image prune -a


  deploy-prod:
    name: Deploy / Prod
    needs: [detect-changes, build-image]
    if: always() && !failure() && !cancelled() && contains(fromJSON('["refs/heads/main"]'), github.ref)
    runs-on: prod
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.ref_name }}
      VNPAY_MOCK: ${{ vars.VNPAY_MOCK }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Infisical Login
        run: |
          INFISICAL_TOKEN="$(
            infisical login \
              --domain="${{ secrets.INFISICAL_URL }}" \
              --method=universal-auth \
              --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" \
              --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" \
              --silent \
              --plain
          )"

          echo "::add-mask::$INFISICAL_TOKEN"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"

      - name: Deploy Swarm stack
        run: |
          infisical run \
            --env=prod \
            --token="$INFISICAL_TOKEN" \
            --domain="${{ secrets.INFISICAL_URL }}" \
            --projectId="${{ secrets.INFISICAL_PROJECT_ID }}" \
            --path=/ \
            -- bash infra/prod/deploy.sh app
          sleep 180
          docker service ls --filter label=com.docker.stack.namespace=smile
          bash infra/prod/deploy.sh cleanup
