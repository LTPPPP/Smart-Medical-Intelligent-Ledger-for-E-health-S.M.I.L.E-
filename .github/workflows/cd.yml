name: CD

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ltpppp/smile

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      any_changed: ${{ steps.build-matrix.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            iam-service:
              - 'backend/service/iam-service/**'
            payment-service:
              - 'backend/service/payment-service/**'
            gateway-service:
              - 'backend/service/gateway-service/**'
            clinical-emr-service:
              - 'backend/service/clinical-emr-service/**'
            smile-client:
              - 'frontend/web/**'
            shared:
              - 'compose.yaml'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - 'ci/**'
              - '.github/workflows/**'
              - 'backend/libs/**'
              - 'backend/package.json'
              - 'backend/package-lock.json'
              - 'backend/tsconfig*.json'

      - name: Build dynamic matrix
        id: build-matrix
        run: bash ci/scripts/build-matrix.sh '${{ steps.filter.outputs.changes }}'

  build-image:
    name: Build (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GATEWAY_URL: ${{ vars.NEXT_PUBLIC_GATEWAY_URL }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [detect-changes, build-image]
    if: always() && !failure() && !cancelled() && contains(fromJSON('["refs/heads/main","refs/heads/dev"]'), github.ref)
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.ref_name }}
      ROOT_DOTENV: ${{ secrets.ROOT_DOTENV }}
      VNPAY_MOCK: ${{ vars.VNPAY_MOCK }}
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from ROOT_DOTENV secret
        run: |
          set -e
          printf '%s\n' "$ROOT_DOTENV" > .env

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate required secrets
        run: |
          set -e
          if ! grep -qE '^POSTGRES_PASSWORD=([^[:space:]]+)$' .env; then
            echo "::error::POSTGRES_PASSWORD is not set in the ROOT_DOTENV secret."
            echo "Backend services will fall back to a blank DB password and fail to connect."
            exit 1
          fi

      - name: Teardown existing stack
        run: |
          set -e
          docker compose -f compose.yaml --env-file .env down --remove-orphans || true

      - name: Deploy
        run: |
          set -e
          docker compose -f compose.yaml --env-file .env pull
          docker compose -f compose.yaml --env-file .env up -d --remove-orphans
          docker image prune -f
