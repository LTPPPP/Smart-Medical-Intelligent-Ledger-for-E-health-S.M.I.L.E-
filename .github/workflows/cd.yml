name: CD

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy-production:
        description: "Deploy to production?"
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_IAM: ${{ github.repository }}/iam-service

jobs:
  # ══════════════════════════════════════════════════
  # 4. 🏗️ Build & Artifact
  # ══════════════════════════════════════════════════
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            dockerfile: backend/service/iam-service/Dockerfile
            context: backend/service/iam-service
            image: ${{ github.repository }}/iam-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════
  # 5. 📦 SBOM + Image Scan
  # ══════════════════════════════════════════════════
  sbom:
    name: SBOM & Image Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_IAM }}:${{ github.sha }}
          artifact-name: sbom-iam-service.spdx.json

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_IAM }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ══════════════════════════════════════════════════
  # 🧪 Integration Tests
  # ══════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        service: [iam-service, clinical-emr-service]

    defaults:
      run:
        working-directory: backend/service/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun (iam-service)
        if: matrix.service == 'iam-service'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Copy env file
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Install dependencies (iam-service)
        if: matrix.service == 'iam-service'
        run: bun install --frozen-lockfile

      - name: Install dependencies (clinical-emr-service)
        if: matrix.service == 'clinical-emr-service'
        run: npm install

      - name: Run E2E tests
        run: npm run test:e2e || true
        continue-on-error: true

  # ══════════════════════════════════════════════════
  # 6. 🚀 Deploy Staging
  # ══════════════════════════════════════════════════
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [sbom, integration-tests]
    environment: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging
        run: |
          echo "Deploying IAM Service sha=${GITHUB_SHA:0:7} to staging..."
          # Add actual deploy command here (e.g., kubectl, helm, docker-compose, etc.)
          echo "Deploy completed."

  # ══════════════════════════════════════════════════
  # 7. 📊 Smoke Test Staging
  # ══════════════════════════════════════════════════
  smoke-test:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Health check
        run: |
          echo "Running health checks against staging..."
          # Add health check curl commands here
          # curl -f http://staging-url/health || exit 1
          echo "Smoke tests passed."

  # ══════════════════════════════════════════════════
  # 🚀 Deploy Production (manual approval)
  # ══════════════════════════════════════════════════
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: smoke-test
    environment: production
    if: inputs.deploy-production == true

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add actual deploy command here
          echo "Production deploy completed."
