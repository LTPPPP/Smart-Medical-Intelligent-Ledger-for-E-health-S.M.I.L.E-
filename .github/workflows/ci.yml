name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            path: backend/service/iam-service
          - service: gateway-service
            path: backend/service/gateway-service
          - service: clinical-emr-service
            path: backend/service/clinical-emr-service
          - service: payment-service
            path: backend/service/payment-service
          - service: web
            path: frontend/web
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: npm ci
      - run: npm run lint
# PLACEHOLDER_TEST_BUILD

  type-check:
    name: Type-check (web)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run type-check

  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            path: backend/service/iam-service
          - service: gateway-service
            path: backend/service/gateway-service
          - service: clinical-emr-service
            path: backend/service/clinical-emr-service
          - service: payment-service
            path: backend/service/payment-service
          - service: web
            path: frontend/web
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: npm ci
      - run: npm test -- --passWithNoTests

  test-ai:
    name: Test (booking-langgraph-service)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ai/booking_langgraph_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/booking_langgraph_service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            path: backend/service/iam-service
          - service: gateway-service
            path: backend/service/gateway-service
          - service: clinical-emr-service
            path: backend/service/clinical-emr-service
          - service: payment-service
            path: backend/service/payment-service
          - service: web
            path: frontend/web
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: npm ci
      - run: npm run build
