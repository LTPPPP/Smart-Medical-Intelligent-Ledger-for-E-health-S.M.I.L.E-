services:
  smile-iam-service:
    container_name: smile-iam-service
    image: ghcr.io/ltpppp/smile/iam-service:${IMAGE_TAG:-main}
    environment:
      APP_PORT: 8080
      APP_URL: ${APP_URL:-${BASE_DOMAIN}:8081}
      NODE_ENV: production
      DATABASE_TYPE: postgres
      DATABASE_HOST: smile-postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: auth_service_db
      DATABASE_SYNCHRONIZE: "false"
      USER_DATABASE_HOST: smile-postgres
      USER_DATABASE_PORT: 5432
      USER_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      USER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      USER_DATABASE_NAME: account_service_db
      USER_DATABASE_SYNCHRONIZE: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_TOKEN_EXPIRES_IN: 15m
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET}
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 30d
      AUTH_FORGOT_SECRET: ${AUTH_FORGOT_SECRET}
      AUTH_FORGOT_TOKEN_EXPIRES_IN: 1h
      AUTH_CONFIRM_EMAIL_SECRET: ${AUTH_CONFIRM_EMAIL_SECRET}
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
      AUTH_OTP_EXPIRES_IN: 5m
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-${BASE_DOMAIN}}
      MAIL_HOST: smile-maildev
      MAIL_PORT: 1025
      MAIL_FROM: noreply@smile.com
      REDIS_URL: redis://smile-redis:6379/3
      # Service-to-service credentials. Required: iam-service refuses to start
      # without them and both guards deny every request when unset.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      IAM_INTERNAL_API_KEY: ${IAM_INTERNAL_API_KEY:?IAM_INTERNAL_API_KEY is required}
    networks:
      - smile-network
    restart: unless-stopped

  smile-clinical-emr-service:
    container_name: smile-clinical-emr-service
    image: ghcr.io/ltpppp/smile/clinical-emr-service:${IMAGE_TAG:-main}
    environment:
      NODE_ENV: production
      APP_PORT: 8080
      API_PREFIX: api
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-${BASE_DOMAIN}}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-${BASE_DOMAIN}:8080}
      DATABASE_TYPE: postgres
      DATABASE_HOST: smile-postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: core_medical_service_db
      DATABASE_SYNCHRONIZE: "false"
      CLINIC_DATABASE_HOST: smile-postgres
      CLINIC_DATABASE_PORT: 5432
      CLINIC_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      CLINIC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CLINIC_DATABASE_NAME: core_clinic_service_db
      CLINIC_DATABASE_SYNCHRONIZE: "false"
      FILE_DRIVER: local
      MAIL_HOST: smile-maildev
      MAIL_PORT: 1025
      MAIL_DEFAULT_EMAIL: noreply@smile.com
      MAIL_DEFAULT_NAME: ClinicalEMR
      # Must match iam-service.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      IAM_INTERNAL_API_KEY: ${IAM_INTERNAL_API_KEY:?IAM_INTERNAL_API_KEY is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET}
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 30d
      AUTH_FORGOT_SECRET: ${AUTH_FORGOT_SECRET}
      AUTH_CONFIRM_EMAIL_SECRET: ${AUTH_CONFIRM_EMAIL_SECRET}
      IAM_SERVICE_URL: http://smile-iam-service:8080
      BOOKING_KYC_ENABLED: "false"
      BOOKING_SKIP_KYC: "true"
      REDIS_URL: redis://smile-redis:6379/1
      REDIS_CACHE_TTL_SECONDS: 300
    networks:
      - smile-network
    restart: unless-stopped

  smile-payment-service:
    container_name: smile-payment-service
    image: ghcr.io/ltpppp/smile/payment-service:${IMAGE_TAG:-main}
    environment:
      NODE_ENV: production
      APP_PORT: 8080
      API_PREFIX: api
      DATABASE_TYPE: postgres
      DATABASE_HOST: smile-postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: payment_service_db
      DATABASE_SYNCHRONIZE: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY}
      VNPAY_MOCK: ${VNPAY_MOCK:-false}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-${BASE_DOMAIN}}
      CLINICAL_EMR_SERVICE_URL: http://smile-clinical-emr-service:8080
      IAM_SERVICE_URL: http://smile-iam-service:8080
      REDIS_URL: redis://smile-redis:6379/4
    networks:
      - smile-network
    restart: unless-stopped

  smile-gateway:
    container_name: smile-gateway
    image: ghcr.io/ltpppp/smile/gateway-service:${IMAGE_TAG:-main}
    environment:
      APP_PORT: 8080
      CORS_ORIGIN: ${FRONTEND_DOMAIN:-${BASE_DOMAIN}}
      IAM_SERVICE_URL: http://smile-iam-service:8080
      CLINICAL_EMR_SERVICE_URL: http://smile-clinical-emr-service:8080
      PAYMENT_SERVICE_URL: http://smile-payment-service:8080
      AI_ROUTES_ENABLED: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      PROXY_TIMEOUT: 30000
      REDIS_URL: redis://smile-redis:6379/0
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 300
    depends_on:
      - smile-iam-service
      - smile-clinical-emr-service
      - smile-payment-service
    networks:
      - smile-network
    restart: unless-stopped

  smile-frontend:
    container_name: smime-client
    image: ghcr.io/ltpppp/smile/frontend:${IMAGE_TAG:-main}
    environment:
      BACKEND_URL: http://smile-gateway:8080
      API_TIMEOUT: ${API_TIMEOUT:-10000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    depends_on:
      - smile-gateway
    networks:
      - smile-network
    restart: unless-stopped

networks:
  smile-network:
    external: true
    name: smile-prod-network
