[project]
name = "smile-ai-booking-agent"
version = "0.1.0"
description = "AI booking/RAG agent service for S.M.I.L.E dental clinic — patient-facing scheduling assistant + admin knowledge-base ingestion."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-community>=0.2",
    "langchain-text-splitters>=0.2",
    "langchain-nvidia-ai-endpoints>=1.0",
    "langgraph>=1.0",
    "qdrant-client>=1.12",
    "fastembed>=0.8",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    "pyjwt>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
