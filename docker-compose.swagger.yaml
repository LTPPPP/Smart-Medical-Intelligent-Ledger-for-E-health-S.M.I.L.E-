services:
  iam-postgres:
    image: postgres:16-alpine
    container_name: smile-iam-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service_db
    ports:
      - "5434:5432"
    volumes:
      - smile_iam_postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init/iam-init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  iam-maildev:
    image: maildev/maildev
    container_name: smile-iam-maildev
    ports:
      - "1080:1080"
      - "1025:1025"

  clinical-postgres:
    image: postgres:16-alpine
    container_name: smile-clinical-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: core_medical_service_db
    ports:
      - "5435:5432"
    volumes:
      - smile_clinical_postgres_data:/var/lib/postgresql/data
      - ./backend/service/clinical-emr-service/docker-init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  clinical-redis:
    image: redis:7-alpine
    container_name: smile-clinical-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  iam-service:
    image: node:20-alpine
    container_name: smile-iam-service
    working_dir: /app
    command: sh -c "npm install && npm run build && npm run start:prod"
    environment:
      APP_PORT: 3001
      APP_HOST: 0.0.0.0
      APP_URL: http://localhost:3001
      APP_FALLBACK_LANGUAGE: en
      APP_HEADER_LANGUAGE: X-Custom-lang
      DATABASE_TYPE: postgres
      DATABASE_HOST: iam-postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: auth_service_db
      DATABASE_SYNCHRONIZE: "true"
      DATABASE_MAX_CONNECTIONS: 100
      DATABASE_SSL_ENABLED: "false"
      USER_DATABASE_HOST: iam-postgres
      USER_DATABASE_PORT: 5432
      USER_DATABASE_USERNAME: postgres
      USER_DATABASE_PASSWORD: postgres
      USER_DATABASE_NAME: account_service_db
      USER_DATABASE_SYNCHRONIZE: "true"
      AUTH_JWT_SECRET: your-super-secret-jwt-key-change-in-production
      AUTH_JWT_TOKEN_EXPIRES_IN: 7d
      AUTH_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
      AUTH_FORGOT_SECRET: your-super-secret-forgot-key-change-in-production
      AUTH_FORGOT_TOKEN_EXPIRES_IN: 1h
      AUTH_CONFIRM_EMAIL_SECRET: your-super-secret-confirm-email-key-change-in-production
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
      AUTH_OTP_EXPIRES_IN: 5m
      IAM_INTERNAL_API_KEY: smile-internal-dev-key
      KYC_PRIVATE_STORAGE_DIR: /app/storage/kyc
      KYC_FILE_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      KYC_RETENTION_DAYS: 365
      KYC_RETENTION_CLEANUP_BATCH_SIZE: 50
      KYC_RETENTION_CLEANUP_ENABLED: "true"
      KYC_RETENTION_CLEANUP_INTERVAL_MS: 86400000
      KYC_OCR_ENABLED: "false"
      KYC_OCR_INTERVAL_MS: 5000
      KYC_OCR_BATCH_SIZE: 2
      KYC_OCR_TIMEOUT_MS: 30000
      KYC_OCR_MAX_ATTEMPTS: 3
      KYC_OCR_STALE_PROCESSING_MS: 60000
      MAIL_HOST: iam-maildev
      MAIL_PORT: 1025
      MAIL_FROM: noreply@smile.com
    ports:
      - "3001:3001"
    volumes:
      - ./backend/service/iam-service:/app
      - smile_iam_node_modules:/app/node_modules
      - smile_iam_kyc_storage:/app/storage/kyc
    depends_on:
      iam-postgres:
        condition: service_healthy
      iam-maildev:
        condition: service_started

  clinical-emr-service:
    image: node:20-alpine
    container_name: smile-clinical-emr-service
    working_dir: /app
    command: sh -c "npm install && npm run build && npm run start:prod"
    environment:
      NODE_ENV: development
      APP_PORT: 3004
      APP_NAME: Clinical EMR Service
      API_PREFIX: api
      APP_FALLBACK_LANGUAGE: en
      APP_HEADER_LANGUAGE: x-custom-lang
      FRONTEND_DOMAIN: http://localhost:3000
      BACKEND_DOMAIN: http://localhost:3000
      DATABASE_TYPE: postgres
      DATABASE_HOST: clinical-postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: core_medical_service_db
      DATABASE_SYNCHRONIZE: "false"
      DATABASE_MAX_CONNECTIONS: 100
      DATABASE_SSL_ENABLED: "false"
      DATABASE_REJECT_UNAUTHORIZED: "false"
      CLINIC_DATABASE_HOST: clinical-postgres
      CLINIC_DATABASE_PORT: 5432
      CLINIC_DATABASE_USERNAME: postgres
      CLINIC_DATABASE_PASSWORD: postgres
      CLINIC_DATABASE_NAME: core_clinic_service_db
      CLINIC_DATABASE_SYNCHRONIZE: "false"
      FILE_DRIVER: local
      MAIL_HOST: iam-maildev
      MAIL_PORT: 1025
      MAIL_IGNORE_TLS: "true"
      MAIL_SECURE: "false"
      MAIL_REQUIRE_TLS: "false"
      MAIL_DEFAULT_EMAIL: noreply@example.com
      MAIL_DEFAULT_NAME: ClinicalEMR
      MAIL_CLIENT_PORT: 1080
      AUTH_JWT_SECRET: change-me-jwt-secret
      AUTH_JWT_TOKEN_EXPIRES_IN: 7d
      AUTH_REFRESH_SECRET: change-me-refresh-secret
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 3650d
      AUTH_FORGOT_SECRET: change-me-forgot-secret
      AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
      AUTH_CONFIRM_EMAIL_SECRET: change-me-confirm-email-secret
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
      IAM_SERVICE_URL: http://iam-service:3001
      IAM_INTERNAL_API_KEY: smile-internal-dev-key
      APPLE_APP_AUDIENCE: "[]"
      WORKER_HOST: redis://clinical-redis:6379/1
      BOOKING_KYC_ENABLED: "false"
      BOOKING_SKIP_KYC: "true"
    ports:
      - "3004:3004"
    volumes:
      - ./backend/service/clinical-emr-service:/app
      - smile_clinical_node_modules:/app/node_modules
    depends_on:
      clinical-postgres:
        condition: service_healthy
      clinical-redis:
        condition: service_healthy

  gateway-service:
    image: node:20-alpine
    container_name: smile-gateway-service
    working_dir: /app
    command: sh -c "npm install && npm run build && npm run start:prod"
    environment:
      APP_PORT: 3000
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000,http://localhost:3005
      IAM_SERVICE_URL: http://iam-service:3001
      CLINICAL_EMR_SERVICE_URL: http://clinical-emr-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3006
      AI_ROUTES_ENABLED: "false"
      PROXY_TIMEOUT: 30000
      SWAGGER_AGGREGATE_DELAY: 8000
    ports:
      - "3000:3000"
    volumes:
      - ./backend/service/gateway-service:/app
      - smile_gateway_node_modules:/app/node_modules
    depends_on:
      iam-service:
        condition: service_started
      clinical-emr-service:
        condition: service_started

volumes:
  smile_iam_postgres_data:
  smile_clinical_postgres_data:
  smile_iam_node_modules:
  smile_iam_kyc_storage:
  smile_clinical_node_modules:
  smile_gateway_node_modules:
