# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  S.M.I.L.E — Docker Compose (Development)                                       ║
# ║  Smart Medical Intelligent Ledger for E-health                                 ║
# ║                                                                                ║
# ║  Usage:                                                                        ║
# ║    docker compose up -d                       # DB + all backend services      ║
# ║    docker compose --profile frontend up -d    # + frontend                     ║
# ║    docker compose --profile chatbot up -d     # + booking orchestrator (chat)  ║
# ║    docker compose up -d postgres redis        # Only databases                 ║
# ║    docker compose logs -f gateway             # Tail gateway logs              ║
# ║    docker compose down -v                     # Stop & remove volumes          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  # ═══════════════════════════════════════════════════════════════════════════
  #  DATABASES
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: smile-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smile_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smile-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smile-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smile-network
    restart: unless-stopped

  maildev:
    image: maildev/maildev
    container_name: smile-maildev
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP
    networks:
      - smile-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  #  BACKEND SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  # ── IAM Service (Auth + User) ──────────────────────────────────────────────
  iam-service:
    build:
      context: ./backend/service/iam-service
      dockerfile: Dockerfile
    container_name: smile-iam-service
    environment:
      APP_PORT: 8081
      APP_URL: http://localhost:8081
      APP_FALLBACK_LANGUAGE: en
      APP_HEADER_LANGUAGE: X-Custom-lang
      NODE_ENV: development
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: auth_service_db
      DATABASE_SYNCHRONIZE: "true"
      DATABASE_MAX_CONNECTIONS: 100
      DATABASE_SSL_ENABLED: "false"
      USER_DATABASE_HOST: postgres
      USER_DATABASE_PORT: 5432
      USER_DATABASE_USERNAME: postgres
      USER_DATABASE_PASSWORD: postgres
      USER_DATABASE_NAME: account_service_db
      USER_DATABASE_SYNCHRONIZE: "true"
      AUTH_JWT_SECRET: smile-dev-jwt-secret-change-in-production
      AUTH_JWT_TOKEN_EXPIRES_IN: 15m
      AUTH_REFRESH_SECRET: smile-dev-refresh-secret-change-in-production
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
      AUTH_FORGOT_SECRET: smile-dev-forgot-secret-change-in-production
      AUTH_FORGOT_TOKEN_EXPIRES_IN: 1h
      AUTH_CONFIRM_EMAIL_SECRET: smile-dev-confirm-email-secret-change-in-production
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
      AUTH_OTP_EXPIRES_IN: 5m
      FRONTEND_DOMAIN: http://localhost:3000
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: noreply@smile.com
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smile-network
    restart: unless-stopped

  # ── Clinical EMR Service (Core Clinic + Medical) ───────────────────────────
  clinical-emr-service:
    build:
      context: ./backend/service/clinical-emr-service
      dockerfile: Dockerfile
      target: migrator
    container_name: smile-clinical-emr-service
    environment:
      NODE_ENV: development
      APP_PORT: 8082
      APP_NAME: "Clinical EMR Service"
      API_PREFIX: api
      APP_FALLBACK_LANGUAGE: en
      APP_HEADER_LANGUAGE: x-custom-lang
      FRONTEND_DOMAIN: http://localhost:3000
      BACKEND_DOMAIN: http://localhost:8082
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: core_medical_service_db
      DATABASE_SYNCHRONIZE: "false"
      DATABASE_MAX_CONNECTIONS: 100
      DATABASE_SSL_ENABLED: "false"
      CLINIC_DATABASE_HOST: postgres
      CLINIC_DATABASE_PORT: 5432
      CLINIC_DATABASE_USERNAME: postgres
      CLINIC_DATABASE_PASSWORD: postgres
      CLINIC_DATABASE_NAME: core_clinic_service_db
      CLINIC_DATABASE_SYNCHRONIZE: "false"
      FILE_DRIVER: local
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      MAIL_IGNORE_TLS: "true"
      MAIL_SECURE: "false"
      MAIL_DEFAULT_EMAIL: noreply@smile.com
      MAIL_DEFAULT_NAME: ClinicalEMR
      MAIL_CLIENT_PORT: 1080
      AUTH_JWT_SECRET: smile-dev-jwt-secret-change-in-production
      AUTH_JWT_TOKEN_EXPIRES_IN: 15m
      AUTH_REFRESH_SECRET: smile-dev-refresh-secret-change-in-production
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 3650d
      AUTH_FORGOT_SECRET: smile-dev-forgot-secret-change-in-production
      AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
      AUTH_CONFIRM_EMAIL_SECRET: smile-dev-confirm-email-secret-change-in-production
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
      IAM_SERVICE_URL: http://iam-service:8081
      WORKER_HOST: redis://redis:6379/1
      # KYC is paused for the current clinical happy-case flow.
      BOOKING_KYC_ENABLED: "false"
      BOOKING_SKIP_KYC: "true"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smile-network
    restart: unless-stopped

  # ── Payment Service (mock VNPay) ───────────────────────────────────────────
  payment-service:
    build:
      context: ./backend/service/payment-service
      dockerfile: Dockerfile
    container_name: smile-payment-service
    environment:
      NODE_ENV: development
      APP_PORT: 3006
      API_PREFIX: api
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: payment_service_db
      DATABASE_SYNCHRONIZE: "true"
      AUTH_JWT_SECRET: smile-dev-jwt-secret-change-in-production
      # Mock VNPay sandbox config (no real merchant credentials needed)
      VNPAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      VNPAY_TMN_CODE: SMILEDEMO
      VNPAY_SECRET_KEY: SMILE_MOCK_SECRET_KEY
      VNPAY_MOCK: "true"
      FRONTEND_DOMAIN: http://localhost:3000
      CLINICAL_EMR_SERVICE_URL: http://clinical-emr-service:8082
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smile-network
    restart: unless-stopped

  # ── API Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./backend/service/gateway-service
      dockerfile: Dockerfile
    container_name: smile-gateway
    environment:
      APP_PORT: 8080
      CORS_ORIGIN: "http://localhost:3000"
      IAM_SERVICE_URL: http://iam-service:8081
      CLINICAL_EMR_SERVICE_URL: http://clinical-emr-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:3006
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:3007
      PROXY_TIMEOUT: 30000
    ports:
      - "8080:8080"
    depends_on:
      - iam-service
      - clinical-emr-service
      - payment-service
    networks:
      - smile-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  #  CHATBOT (optional — use `--profile chatbot`)
  # ═══════════════════════════════════════════════════════════════════════════

  booking-orchestrator:
    build:
      context: ./ai/booking_orchestrator
      dockerfile: Dockerfile
    container_name: smile-booking-orchestrator
    environment:
      # Mock mode: returns canned booking responses, no model weights / API keys needed.
      CHATBOT_MODE: mock
      LLM_PROVIDER: mock
      GATEWAY_URL: http://gateway:8080/api/v1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/core_medical_service_db
    ports:
      - "8089:8089"
    depends_on:
      - postgres
    networks:
      - smile-network
    profiles:
      - chatbot
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  #  FRONTEND (optional — use `--profile frontend`)
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: smile-frontend
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_ACCOUNT_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_CHATBOT_URL: http://localhost:8089
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - smile-network
    profiles:
      - frontend
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  #  MONITORING (optional — use `--profile monitoring`)
  # ═══════════════════════════════════════════════════════════════════════════

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smile-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smile.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - smile-network
    profiles:
      - monitoring
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════════════════
#  VOLUMES
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
#  NETWORKS
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  smile-network:
    driver: bridge
    name: smile-dev-network
