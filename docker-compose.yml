# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  S.M.I.L.E — Docker Compose (Development)                                 ║
# ║  Smart Medical Intelligent Ledger for E-health                             ║
# ║                                                                            ║
# ║  Usage:                                                                    ║
# ║    docker compose up -d                     # Start all services           ║
# ║    docker compose --profile frontend up -d  # Include frontend             ║
# ║    docker compose up -d postgres redis      # Only databases               ║
# ║    docker compose logs -f gateway            # Tail gateway logs           ║
# ║    docker compose down -v                   # Stop & remove volumes        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  # ═══════════════════════════════════════════════════════════════════════════
  #  DATABASES
  # ═══════════════════════════════════════════════════════════════════════════

  # ── PostgreSQL (shared instance — all service DBs) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smile-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smile_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smile-network
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smile-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smile-network
    restart: unless-stopped

  # ── MailDev (local email testing) ──────────────────────────────────────────
  maildev:
    image: maildev/maildev
    container_name: smile-maildev
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP
    networks:
      - smile-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  #  BACKEND SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  # ── IAM Service (Auth + User) ──────────────────────────────────────────────
  iam-service:
    build:
      context: ./backend/service/iam-service
      dockerfile: Dockerfile
    container_name: smile-iam-service
    environment:
      # App
      APP_PORT: 3001
      APP_URL: http://localhost:3001
      APP_FALLBACK_LANGUAGE: en
      NODE_ENV: development
      # Database — Auth
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: auth_service_db
      DATABASE_SYNCHRONIZE: "true"
      DATABASE_MAX_CONNECTIONS: 100
      DATABASE_SSL_ENABLED: "false"
      # Database — User
      USER_DATABASE_HOST: postgres
      USER_DATABASE_PORT: 5432
      USER_DATABASE_USERNAME: postgres
      USER_DATABASE_PASSWORD: postgres
      USER_DATABASE_NAME: account_service_db
      USER_DATABASE_SYNCHRONIZE: "true"
      # Auth / JWT
      AUTH_JWT_SECRET: smile-dev-jwt-secret-change-in-production
      AUTH_JWT_TOKEN_EXPIRES_IN: 15m
      AUTH_REFRESH_SECRET: smile-dev-refresh-secret-change-in-production
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
      AUTH_FORGOT_SECRET: smile-dev-forgot-secret-change-in-production
      AUTH_FORGOT_TOKEN_EXPIRES_IN: 1h
      AUTH_CONFIRM_EMAIL_SECRET: smile-dev-confirm-email-secret-change-in-production
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
      AUTH_OTP_EXPIRES_IN: 5m
      # Mail
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: noreply@smile.com
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smile-network
    restart: unless-stopped

  # ── Clinical EMR Service (Core Clinic + Medical) ───────────────────────────
  clinical-emr-service:
    build:
      context: ./backend/service/clinical-emr-service
      dockerfile: Dockerfile
      target: migrator
    container_name: smile-clinical-emr-service
    environment:
      # App
      NODE_ENV: development
      APP_PORT: 8082
      APP_NAME: "Clinical EMR Service"
      API_PREFIX: api
      APP_FALLBACK_LANGUAGE: en
      FRONTEND_DOMAIN: http://localhost:3000
      BACKEND_DOMAIN: http://localhost:3000
      IAM_SERVICE_URL: http://iam-service:3001
      IAM_INTERNAL_API_KEY: smile-internal-dev-key
      # Database — Medical
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: core_medical_service_db
      DATABASE_SYNCHRONIZE: "false"
      DATABASE_MAX_CONNECTIONS: 100
      DATABASE_SSL_ENABLED: "false"
      # Database — Clinic
      CLINIC_DATABASE_HOST: postgres
      CLINIC_DATABASE_PORT: 5432
      CLINIC_DATABASE_USERNAME: postgres
      CLINIC_DATABASE_PASSWORD: postgres
      CLINIC_DATABASE_NAME: core_clinic_service_db
      CLINIC_DATABASE_SYNCHRONIZE: "false"
      # File Storage
      FILE_DRIVER: local
      # Mail
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      MAIL_IGNORE_TLS: "true"
      MAIL_SECURE: "false"
      MAIL_DEFAULT_EMAIL: noreply@smile.com
      MAIL_DEFAULT_NAME: ClinicalEMR
      MAIL_CLIENT_PORT: 1080
      # Auth / JWT
      AUTH_JWT_SECRET: smile-dev-jwt-secret-change-in-production
      AUTH_JWT_TOKEN_EXPIRES_IN: 15m
      AUTH_REFRESH_SECRET: smile-dev-refresh-secret-change-in-production
      AUTH_REFRESH_TOKEN_EXPIRES_IN: 3650d
      AUTH_FORGOT_SECRET: smile-dev-forgot-secret-change-in-production
      AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
      AUTH_CONFIRM_EMAIL_SECRET: smile-dev-confirm-email-secret-change-in-production
      AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
      # Worker / Redis
      WORKER_HOST: redis://redis:6379/1
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smile-network
    restart: unless-stopped

  # ── API Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./backend/service/gateway-service
      dockerfile: Dockerfile
    container_name: smile-gateway
    environment:
      APP_PORT: 3000
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000,http://localhost:3100"
      # Downstream services — use internal Docker DNS
      IAM_SERVICE_URL: http://iam-service:3001
      CLINICAL_EMR_SERVICE_URL: http://clinical-emr-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:3006
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:3007
      PROXY_TIMEOUT: 30000
    ports:
      - "3000:3000"
    depends_on:
      - iam-service
      - clinical-emr-service
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health/live",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - smile-network
    restart: unless-stopped

  # ── AI Booking Agent Service ─────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:v0.21.0
    container_name: smile-vllm
    profiles:
      - agentic-chatbot
      - langgraph-chatbot
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      VLLM_MODEL_NAME: Qwen/Qwen3.5-4B
      VLLM_MAX_MODEL_LEN: "528"
      VLLM_MAX_NUM_SEQS: "1"
      VLLM_MAX_NUM_BATCHED_TOKENS: "1024"
      VLLM_GPU_MEMORY_UTILIZATION: "0.90"
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
    command:
      - --model
      - Qwen/Qwen3.5-4B
      - --served-model-name
      - Qwen/Qwen3.5-4B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trust-remote-code
      - --generation-config
      - vllm
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "528"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "1024"
      - --enable-prefix-caching
    ports:
      - "8000:8000"
    volumes:
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - /usr/lib/wsl:/usr/lib/wsl:ro
    devices:
      - /dev/dxg:/dev/dxg
    security_opt:
      - apparmor=unconfined
    ipc: host
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - smile-network
    restart: unless-stopped

  booking-agent-service:
    build:
      context: ./ai/booking_agent_service
      dockerfile: Dockerfile
    container_name: smile-booking-agent-service
    profiles:
      - agentic-chatbot
    environment:
      BOOKING_AGENT_EMR_BASE_URL: http://clinical-emr-service:8082
      BOOKING_AGENT_REDIS_URL: redis://redis:6379/2
      BOOKING_AGENT_REQUIRE_CUDA: "false"
      BOOKING_AGENT_STEP_BUDGET: "3"
      BOOKING_AGENT_SESSION_LOCK_TTL_SECONDS: "8"
      BOOKING_AGENT_LLM_BASE_URL: http://vllm:8000/v1
      BOOKING_AGENT_LLM_MODEL: Qwen/Qwen3.5-4B
    ports:
      - "8020:8020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      clinical-emr-service:
        condition: service_started
      vllm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smile-network
    restart: unless-stopped

  # ── AI Booking LangGraph Service ────────────────────────────────────────
  booking-langgraph-service:
    build:
      context: ./ai/booking_langgraph_service
      dockerfile: Dockerfile
    container_name: smile-booking-langgraph-service
    profiles:
      - langgraph-chatbot
    environment:
      BOOKING_LANGGRAPH_EMR_BASE_URL: http://clinical-emr-service:8082
      BOOKING_LANGGRAPH_LLM_BASE_URL: http://vllm:8000/v1
      BOOKING_LANGGRAPH_LLM_MODEL: Qwen/Qwen3.5-4B
      BOOKING_LANGGRAPH_ACTOR_ID: 00000000-0000-4000-8000-000000000000
      BOOKING_LANGGRAPH_REQUEST_TIMEOUT_SECONDS: "8"
    ports:
      - "8030:8030"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clinical-emr-service:
        condition: service_started
      vllm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smile-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  #  FRONTEND (optional — use `--profile frontend`)
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: smile-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3100:3000"
    depends_on:
      - gateway
    networks:
      - smile-network
    profiles:
      - frontend
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  #  MONITORING (optional — use `--profile monitoring`)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── pgAdmin ────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smile-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smile.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - smile-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ── RedisInsight ───────────────────────────────────────────────────────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: smile-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - smile-network
    profiles:
      - monitoring
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════════════════
#  VOLUMES
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
#  NETWORKS
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  smile-network:
    external: true
    name: smile-dev-network
