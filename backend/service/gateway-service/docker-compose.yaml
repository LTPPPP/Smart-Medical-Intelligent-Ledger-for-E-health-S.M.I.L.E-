services:
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smile-gateway
    env_file:
      - .env
    environment:
      APP_PORT: 3000
      CORS_ORIGIN: http://localhost:3002,http://localhost:5173,http://localhost:3000,http://localhost:3005
      IAM_SERVICE_URL: http://iam-service:3001
      CLINICAL_EMR_SERVICE_URL: http://clinical-emr-service:8082
      BOOKING_LANGGRAPH_SERVICE_URL: http://booking-langgraph-service:8030
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      PAYMENT_SERVICE_URL: http://payment-service:3006
    ports:
      - "3000:3000"
    networks:
      - smile-dev-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health/live",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  smile-dev-network:
    external: true
    name: smile-dev-network
