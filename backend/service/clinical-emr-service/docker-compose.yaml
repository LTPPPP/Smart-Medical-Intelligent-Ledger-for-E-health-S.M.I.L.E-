services:
  # ─── PostgreSQL (chứa cả hai databases) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clinical-emr-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: core_medical_service_db
    ports:
      - '5435:5432'
    volumes:
      - clinical_postgres_data:/var/lib/postgresql/data
      - ./docker-init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clinical-emr-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Clinical EMR API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: clinical-emr-api
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: core_medical_service_db
      CLINIC_DATABASE_HOST: postgres
      CLINIC_DATABASE_PORT: 5432
      CLINIC_DATABASE_USERNAME: postgres
      CLINIC_DATABASE_PASSWORD: postgres
      CLINIC_DATABASE_NAME: core_clinic_service_db
      WORKER_HOST: redis://redis:6379/1
      APP_PORT: 8082
    ports:
      - '8082:8082'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clinical_postgres_data:
